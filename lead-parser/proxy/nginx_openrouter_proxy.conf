# Reverse proxy to OpenRouter — deploy on a non-RU VPS to bypass OpenRouter's
# WAF block on Beget/Russia IPs. lead-parser's OPENROUTER_URL points here instead
# of https://openrouter.ai directly; Authorization header (Bearer key) passes through untouched.
server {
    listen 80;
    server_name _;

    location /api/v1/chat/completions {
        proxy_pass https://openrouter.ai/api/v1/chat/completions;
        proxy_set_header Host openrouter.ai;
        proxy_ssl_server_name on;
        proxy_ssl_name openrouter.ai;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
