<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Parser — Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 150px;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .char-count {
            font-size: 0.9em;
            color: #999;
            margin-top: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        button:hover {
            background: #5568d3;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
        }
        .result.error {
            background: #fff5f5;
            border-left: 4px solid #e53e3e;
        }
        .result.error {
            color: #c53030;
        }
        .result h3 {
            margin-bottom: 15px;
            color: #667eea;
        }
        .result.error h3 {
            color: #c53030;
        }
        .result-item {
            margin-bottom: 15px;
        }
        .result-item strong {
            display: block;
            color: #333;
            margin-bottom: 5px;
        }
        .result-item span {
            display: block;
            color: #666;
        }
        .relevance-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }
        .relevance-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }
        .tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        .back-link a:hover {
            color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Lead Parser Demo</h1>
            <p>Попробуй анализировать заявки, для пользователей один раза в день</p>
        </div>

        <div class="card">
            <form id="demoForm">
                <div class="form-group">
                    <label for="text">Текст заявки</label>
                    <textarea
                        id="text"
                        name="text"
                        placeholder="Вставь текст заявки на фриланс, например: 'Нужен сайт для интернет-магазина, бюджет 100 тыс. руб.'"></textarea>
                    <div class="char-count">
                        <span id="charCount">0</span> / 1000 символов
                    </div>
                </div>
                <button type="submit" id="submitBtn">Анализировать</button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px;">Анализирую заявку...</p>
            </div>

            <div class="result" id="result"></div>

            <div class="back-link">
                <a href="/leads/">← Вернуться к лидам</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('demoForm');
        const textInput = document.getElementById('text');
        const submitBtn = document.getElementById('submitBtn');
        const charCount = document.getElementById('charCount');
        const result = document.getElementById('result');
        const loading = document.getElementById('loading');

        function hasUrl(text) {
            return /https?:\/\/|www\.|ftp:\/\//i.test(text);
        }

        textInput.addEventListener('input', () => {
            charCount.textContent = textInput.value.length;
            const isValid = textInput.value.length >= 10 && !hasUrl(textInput.value);
            submitBtn.disabled = !isValid;

            if (hasUrl(textInput.value)) {
                showError('Ссылки не допускаются. Пожалуйста, удалите URL');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const text = textInput.value.trim();
            if (text.length < 10 || text.length > 1000) {
                showError('Текст должен быть от 10 до 1000 символов');
                return;
            }

            submitBtn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('text', text);

                const response = await fetch('/leads/demo/analyze', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Ошибка анализа');
                    return;
                }

                showResult(data);
            } catch (err) {
                showError('Сетевая ошибка. Попробуй позже');
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        function showError(message) {
            result.className = 'result error';
            result.innerHTML = `<h3>❌ ${message}</h3>`;
            result.style.display = 'block';
        }

        function showResult(data) {
            const relevance = data.relevance_score || 0;
            const tags = (data.tags || '')
                .split(',')
                .filter(t => t.trim())
                .map(t => `<span class="tag">${t.trim()}</span>`)
                .join('');

            result.className = 'result success';
            result.innerHTML = `
                <h3>✅ Результаты анализа</h3>
                <div class="result-item">
                    <strong>Релевантность</strong>
                    <span>${relevance}%</span>
                    <div class="relevance-bar">
                        <div class="relevance-fill" style="width: ${relevance}%"></div>
                    </div>
                </div>
                ${tags ? `<div class="result-item">
                    <strong>Категории</strong>
                    <div class="tags">${tags}</div>
                </div>` : ''}
                ${data.summary ? `<div class="result-item">
                    <strong>Резюме</strong>
                    <span>${escapeHtml(data.summary)}</span>
                </div>` : ''}
                ${data.estimated_budget ? `<div class="result-item">
                    <strong>Оценка бюджета</strong>
                    <span>${data.estimated_budget.toLocaleString('ru-RU')} ₽</span>
                </div>` : ''}
            `;
            result.style.display = 'block';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        submitBtn.disabled = true;
    </script>
</body>
</html>
