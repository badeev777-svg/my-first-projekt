{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-20">
  <div class="bg-gray-900 border border-gray-800 rounded-xl p-8">
    <h1 class="text-2xl font-bold mb-8 text-center">Lead Parser Admin</h1>

    {% if error %}
    <div class="bg-red-900/30 border border-red-700 text-red-400 px-4 py-3 rounded mb-6 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      <div>
        <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
          Пароль
        </label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autofocus
          class="w-full bg-gray-800 border border-gray-700 rounded px-4 py-2 text-gray-200 placeholder-gray-500 focus:outline-none focus:border-blue-600"
          placeholder="Введи пароль"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded font-medium transition-colors"
      >
        Войти
      </button>
    </form>

    <p class="text-center text-xs text-gray-500 mt-6">
      🔒 Панель администратора
    </p>
  </div>
</div>
{% endblock %}
